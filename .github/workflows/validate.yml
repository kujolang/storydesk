name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  # Includes bounded directory paging; released 1.4.0 predates this primitive.
  KUJO_COMMIT: cf785c0a7953717af16b657cda05b85d628144c5
jobs:
  kujo-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: ${{ env.KUJO_COMMIT }}
          path: .runtime/kujo
      - id: toolchain
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      - name: Restore pinned runtime
        id: runtime-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .runtime/kujo/target/release/kujo${{ runner.os == 'Windows' && '.exe' || '' }}
          key: kujo-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.KUJO_COMMIT }}-${{ steps.toolchain.outputs.cachekey }}
      - name: Build pinned Kujo runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        run: cargo build --locked --release --manifest-path .runtime/kujo/Cargo.toml
      - name: Build pinned Kujo runtime with native Windows tools
        if: steps.runtime-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          # Git Bash puts its incomplete MSYS Perl ahead of native Perl.
          (Get-Command perl.exe).Source
          perl -MIPC::Cmd -e 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --manifest-path .runtime/kujo/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache successfully built runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .runtime/kujo/target/release/kujo${{ runner.os == 'Windows' && '.exe' || '' }}
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Validate full suite and contention
        shell: bash
        env:
          KUJO_BIN: ${{ github.workspace }}/.runtime/kujo/target/release/kujo${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          bash scripts/validate.sh > validation.log 2>&1 || { tail -100 validation.log; exit 1; }
          bash scripts/contention_benchmark.sh 24 > contention.json
      - name: Isolated performance and RSS qualification
        if: runner.os == 'Linux'
        shell: bash
        env:
          KUJO_BIN: ${{ github.workspace }}/.runtime/kujo/target/release/kujo
        run: bash scripts/qualification.sh qualification > qualification.log 2>&1 || { tail -100 qualification.log; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-${{ runner.os }}
          path: |
            validation.log
            contention.json
            qualification.log
            qualification/

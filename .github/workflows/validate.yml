name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  KUJO_COMMIT: 5059695d14d6726bc17fef55e0b95511624967cf
jobs:
  kujo-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: ${{ env.KUJO_COMMIT }}
          path: .runtime/kujo
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      - name: Build pinned Kujo runtime
        run: cargo build --release --manifest-path .runtime/kujo/Cargo.toml
      - name: Validate
        env:
          KUJO_BIN: ${{ github.workspace }}/.runtime/kujo/target/release/kujo
        run: bash scripts/validate.sh
  contention:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install released Kujo runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS/$(uname -m)" in
            Linux/*) asset=kujo-v1.0.1-linux-x64.tar.gz ;;
            macOS/arm64|macOS/aarch64) asset=kujo-v1.0.1-macos-arm64.tar.gz ;;
            macOS/*) asset=kujo-v1.0.1-macos-x64.tar.gz ;;
            Windows/*) asset=kujo-v1.0.1-windows-x64.zip ;;
            *) printf 'unsupported launch environment\n' >&2; exit 1 ;;
          esac
          mkdir -p .runtime-bin
          gh release download v1.0.1 --repo kujolang/kujo --pattern "$asset" --pattern "$asset.sha256" --dir .runtime-bin
          (cd .runtime-bin && sha256sum -c "$asset.sha256")
          if [[ "$asset" == *.zip ]]; then unzip -q ".runtime-bin/$asset" -d .runtime-bin; else tar -xzf ".runtime-bin/$asset" -C .runtime-bin; fi
      - name: Run multi-process contention benchmark
        shell: bash
        env:
          KUJO_BIN: ${{ github.workspace }}/.runtime-bin/kujo${{ runner.os == 'Windows' && '.exe' || '' }}
        run: bash scripts/contention_benchmark.sh 24 | tee contention-${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: contention-${{ runner.os }}
          path: contention-${{ runner.os }}.json
